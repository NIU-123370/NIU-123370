<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Niu Ruibo — Building agents. Shipping ideas.</title>
<desc id="desc">An electric blue wireframe planet with slowly orbiting violet and cyan nodes. AI agents, RAG, and open source.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#10172D"/><stop offset=".55" stop-color="#0D1026"/><stop offset="1" stop-color="#18133C"/></linearGradient>
  <linearGradient id="ink" x1="75" y1="160" x2="580" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#F4F6FF"/><stop offset=".55" stop-color="#DAE1FF"/><stop offset="1" stop-color="#A59DFF"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#635BEB" stop-opacity=".28"/><stop offset=".65" stop-color="#4C46AA" stop-opacity=".1"/><stop offset="1" stop-color="#5147C6" stop-opacity="0"/></radialGradient>
  <radialGradient id="sphere" cx=".3" cy=".25" r=".85"><stop stop-color="#596CD8" stop-opacity=".22"/><stop offset="1" stop-color="#0E1533" stop-opacity=".55"/></radialGradient>
  <linearGradient id="wire" x1="848" y1="120" x2="1100" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#8CDCF5"/><stop offset=".5" stop-color="#7994FF"/><stop offset="1" stop-color="#A785FF"/></linearGradient>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="clip"><rect width="1280" height="480" rx="24"/></clipPath>
</defs>
<style>
  .orbit{transform-origin:980px 246px;animation:orbit 32s linear infinite}
  .orbit-reverse{transform-origin:980px 246px;animation:orbit 44s linear infinite reverse}
  .pulse{animation:pulse 6s ease-in-out infinite}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
  @media(prefers-reduced-motion:reduce){.orbit,.orbit-reverse,.pulse{animation:none}}
</style>
