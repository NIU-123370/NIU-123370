<svg xmlns="http://www.w3.org/2000/svg" width="600" height="326" viewBox="0 0 600 326" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Making long-running AI agents observable, accountable, and verifiable.</title>
<desc id="desc">Dimensional neon typography on a floating glass panel, with a deep blue and violet atmosphere, soft shadow, highlighted edges and slow moving light.</desc>
<defs>
  <linearGradient id="face" x1="84.00000000000001" y1="95" x2="522.0" y2="175" gradientUnits="userSpaceOnUse"><stop stop-color="#95FFF1"/><stop offset=".3" stop-color="#86DCFF"/><stop offset=".66" stop-color="#C4B0FF"/><stop offset="1" stop-color="#FFB2E9"/></linearGradient>
  <linearGradient id="depth" x2="0" y2="1"><stop stop-color="#394977"/><stop offset="1" stop-color="#182340"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="600" y2="326" gradientUnits="userSpaceOnUse"><stop stop-color="#1A3049"/><stop offset=".42" stop-color="#101C33"/><stop offset="1" stop-color="#261C40"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="600" y2="326" gradientUnits="userSpaceOnUse"><stop stop-color="#77EBFF" stop-opacity=".7"/><stop offset=".38" stop-color="#6F9BCF" stop-opacity=".12"/><stop offset=".72" stop-color="#CAA5FF" stop-opacity=".24"/><stop offset="1" stop-color="#FFAFE6" stop-opacity=".75"/></linearGradient>
  <radialGradient id="cyan"><stop stop-color="#0FBDDF" stop-opacity=".32"/><stop offset="1" stop-color="#0FBDDF" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#9D48E7" stop-opacity=".34"/><stop offset="1" stop-color="#9D48E7" stop-opacity="0"/></radialGradient>
  <linearGradient id="shine"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#F0FCFF" stop-opacity=".44"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-15%" y="-25%" width="130%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00040D" flood-opacity=".7"/></filter>
  <filter id="text-shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#04081B" flood-opacity=".75"/></filter>
  <filter id="text-glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="panel"><rect x="18" y="18" width="564" height="290" rx="19"/></clipPath>
  <clipPath id="letters"><text x="300.0" y="175" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="79" font-weight="900" letter-spacing="-3">AI AGENTS</text></clipPath>
</defs>
<style>.light{animation:light 10s ease-in-out infinite}.atmosphere{animation:atmosphere 11s ease-in-out infinite alternate}@keyframes light{0%,15%{transform:translateX(-400px)}85%,100%{transform:translateX(1000px)}}@keyframes atmosphere{from{opacity:.55;transform:translateX(-15px)}to{opacity:1;transform:translateX(15px)}}@media(prefers-reduced-motion:reduce){.light,.atmosphere{animation:none}.light{opacity:0}}</style>
<rect width="600" height="326" fill="#0D1117"/>
<path d="M41 22L577 35L554 316L12 296Z" fill="#15172E" stroke="#7D72BD" stroke-opacity=".23"/>
<rect x="18" y="18" width="564" height="290" rx="19" fill="url(#glass)" filter="url(#shadow)"/>
<g clip-path="url(#panel)">
  <g class="atmosphere"><ellipse cx="144.0" cy="143.44" rx="240.0" ry="215.16" fill="url(#cyan)"/><ellipse cx="491.99999999999994" cy="211.9" rx="240.0" ry="228.2" fill="url(#violet)"/></g>
  <path d="M18 228.2L384.0 18H491.99999999999994L18 306.44Z" fill="#B8D2FF" opacity=".023"/>
  <path d="M42 19H558" stroke="#BAE5FF" stroke-opacity=".35"/>
</g>
<rect x="18.5" y="18.5" width="563" height="289" rx="19" stroke="url(#edge)" stroke-width="1.3"/>
<text x="300.0" y="75" text-anchor="middle" fill="#C1D3E6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="28" letter-spacing="-.6">Making long-running</text>
<g text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="79" font-weight="900" letter-spacing="-3">
  <text x="300.0" y="175" fill="url(#face)" opacity=".26" filter="url(#text-glow)">AI AGENTS</text>
  <text x="300.0" y="183" fill="#151F3A" filter="url(#text-shadow)">AI AGENTS</text>
  <text x="300.0" y="180" fill="#273957">AI AGENTS</text>
  <text x="300.0" y="177" fill="#51628D">AI AGENTS</text>
  <text x="300.0" y="175" fill="url(#face)">AI AGENTS</text>
  <text x="300.0" y="175" fill="none" stroke="#F3FCFF" stroke-width=".65" stroke-opacity=".48">AI AGENTS</text>
</g>
<g clip-path="url(#letters)"><rect class="light" x="-150" y="95" width="200" height="160" fill="url(#shine)"/></g>
<g text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="21" letter-spacing=".2"><text x="300.0" y="239" fill="#B8EAFF">observable<tspan fill="#8294AE"> · </tspan><tspan fill="#D4C1FF">accountable</tspan></text><text x="300.0" y="272" fill="#FFC3E7">verifiable</text></g>
</svg>